<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COVID-19 Early Outbreak Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
<h1>COVID-19 Early Outbreak Dashboard</h1>
<p class="sub">Tracking early COVID-19 global data (Jan-Mar 2020)</p>

<div class="controls">
<label>Select Country: </label>
<select id="countrySelect">
<option value="global">Global</option>
<option value="USA">USA</option>
<option value="China">China</option>
<option value="Italy">Italy</option>
<option value="South Africa">South Africa</option>
<option value="Spain">Spain</option>
<option value="Germany">Germany</option>
</select>
</div>

<div class="cards">
<div class="card c1"><h3>Confirmed</h3><p id="confirmed">0</p></div>
<div class="card c2"><h3>Deaths</h3><p id="deaths">0</p></div>
<div class="card c3"><h3>Recovered</h3><p id="recovered">0</p></div>
<div class="card c4"><h3>Active</h3><p id="active">0</p></div>
</div>

<div class="charts">
<div class="box"><h3>Cases Over Time</h3><canvas id="lineChart"></canvas></div>
<div class="box"><h3>Cases by Type</h3><canvas id="pieChart"></canvas></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
