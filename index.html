<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COVID Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h2>COVID Dashboard - Due Today</h2>
<select id="country"></select> <span id="s"></span>
<canvas id="c"></canvas>
<script>
let chartObj = null;
fetch('covid-19.json').then(r=>r.json()).then(j=>{
  console.log('Loaded', j);
  document.getElementById('s').innerText = 'Loaded '+j.countries.length+' countries';
  let sel = document.getElementById('country');
  sel.innerHTML = j.countries.map(c=>`<option>${c.country}</option>`).join('');
  
  function draw(){
    let n = sel.value;
    let cc = j.countries.find(x=>x.country==n);
    if(chartObj) chartObj.destroy();
    chartObj = new Chart(document.getElementById('c'), {
      type: 'line',
      data: {
        labels: cc.data.map(d=>d.date),
        datasets: [{
          label: 'Confirmed Cases - '+n,
          data: cc.data.map(d=>d.confirmed),
          borderColor: 'blue',
          borderWidth: 2,
          fill: false
        }]
      }
    });
  }
  sel.onchange = draw;
  draw();
});
</script>
</body>
</html>
